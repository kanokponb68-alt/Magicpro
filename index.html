<!DOCTYPE html>
<html lang="th">
<head>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap');

*{margin:0;padding:0;box-sizing:border-box;}

body{
    font-family:'Cinzel', serif;
    background: radial-gradient(circle at center,#1a0f2e,#0c0618 70%);
    color:#f5e6c8;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding:20px;
}

.book{
    width:100%;
    max-width:600px;
    background:linear-gradient(to right,#f5e6c8,#ead3a1);
    border-radius:12px;
    padding:40px;
    text-align:center;
    color:#4b2c0a;
    box-shadow:0 0 40px rgba(255,215,120,0.4);
    margin-bottom:25px;
}

button{
    margin-top:20px;
    padding:12px 28px;
    border:none;
    border-radius:30px;
    background:linear-gradient(45deg,#b98bff,#ffd86b);
    cursor:pointer;
    font-size:16px;
    transition:0.3s;
}

button:disabled{
    opacity:0.5;
    cursor:not-allowed;
}

.prediction-box{
    width:100%;
    max-width:700px;
    min-height:120px;
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,215,120,0.5);
    border-radius:15px;
    padding:25px;
    text-align:center;
    font-size:20px;
    line-height:1.7;
    box-shadow:0 0 25px rgba(180,120,255,0.2);
    backdrop-filter:blur(6px);
}
.countdown{
    font-size:26px;
    margin-top:10px;
    color:#ffd86b;
}
</style>
</head>

<div class="book">
    <h2>คัมภีร์แห่งโชคชะตา</h2>
    <p>ตั้งจิตให้มั่น แล้วรอรับคำพยากรณ์</p>
    <button id="btn" onclick="startPrediction()">เปิดคำทำนาย</button>
</div>

<div class="prediction-box" id="predictionBox">
    คำทำนายของท่านจะปรากฏที่นี่...
    <div class="countdown" id="countdown"></div>
</div>

while(predictions.length < 100){
    predictions.push("พลังแห่งโชคชะตากำลังหมุนรอบตัวท่าน หมายเลขที่ "+predictions.length);
}

function startPrediction(){

    const btn = document.getElementById("btn");
    const box = document.getElementById("predictionBox");
    const countdownEl = document.getElementById("countdown");
    const whisper = document.getElementById("whisperSound");
    const suspense = document.getElementById("suspenseSound");

    btn.disabled = true;
    box.innerHTML = "คัมภีร์กำลังเปิดเผยโชคชะตา...";
    box.appendChild(countdownEl);

    whisper.play();
    setTimeout(()=>{ suspense.play(); },1000);

    let timeLeft = 5;
    countdownEl.innerText = "รอคำทำนาย... "+timeLeft;

    const timer = setInterval(()=>{
        timeLeft--;
        countdownEl.innerText = "รอคำทำนาย... "+timeLeft;
        if(timeLeft <= 0){
            clearInterval(timer);
            suspense.pause();
            suspense.currentTime = 0;

            const randomIndex = Math.floor(Math.random()*predictions.length);
            box.innerHTML = predictions[randomIndex];
            btn.disabled = false;
        }
    },1000);
}
